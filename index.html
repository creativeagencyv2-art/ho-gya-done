 app.innerHTML=`<section class="hero3"><div class="ht"><span class="pill2"><i></i> Orders open · Delivery on WhatsApp</span>
 <h1>All your AI tools and subscriptions, <span class="hl">one store.</span></h1>
 <p>ChatGPT, Claude, Gemini, Netflix, Canva and more at pocket-friendly prices. Pick a plan and order on WhatsApp.</p>

 <div class="tick"><div class="tk">${t1}${t1}</div></div><div class="tick t2"><div class="tk rev">${t2}${t2}</div></div>

 <section class="sec"><h2>How it works</h2><p>From browsing to delivery, all in one chat.</p><div class="steps"><div class="step rv"><i>01</i><h3>Choose</h3><p>Find your tool and pick a plan.</p></div><div class="step rv"><i>02</i><h3>Order</h3><p>Tap Buy. WhatsApp opens with your order ready.</p></div><div class="step rv"><i>03</i><h3>Get it</h3><p>Pay by UPI and receive your details in chat.</p></div></div></section>

  const q=$("#q").value.trim().toLowerCase();
  const list=PREMIUM.filter(p=>p[0].toLowerCase().includes(q)&&(cat==="All"||CAT[p[0]]===cat));
  $("#cn").textContent=list.length+" tools";
  $("#gr").innerHTML=list.length?list.map(p=>`<div class="svc"><div class="svc-h">${LOGOS[p[0]]?`<div class="badge lg${isFull(p[0])?" full":""}"><img src="${LOGOS[p[0]]}" alt="${esc(p[0])} logo" data-i onload="this.classList.add('ld')" loading="lazy" decoding="async"></div>`:`<div class="badge" style="background:#e6007e">${esc(p[0][0])}</div>`}<div><h3>${esc(p[0])}</h3><small>${esc(CAT[p[0]]||"")}</small></div></div><div class="plans">${p[1].map(pl=>`<div class="plan"><div><b>${esc(pl[0])}</b>${pl[2]?`<small>⏱ ${esc(pl[2])}</small>`:""}</div><div style="display:flex;gap:10px;align-items:center"><span class="price">${rs(pl[1])}</span><button class="buy" data-n="${esc(p[0])}" data-p="${esc(pl[0])}" data-d="${esc(pl[2])}" data-c="${pl[1]??""}">Buy</button></div></div>`).join("")}</div></div>`).join(""):`<div class="empty">No tool found. Ask us on WhatsApp, we may still have it.</div>`;
  $("#gr").querySelectorAll(".buy").forEach(b=>b.onclick=()=>{wa(`Hi ${BRAND}, I want to buy:\nService: ${b.dataset.n}\nPlan: ${b.dataset.p}${b.dataset.d?" ("+b.dataset.d+")":""}\nPrice: ${b.dataset.c?"₹"+b.dataset.c:"to confirm"}`);toast("Opening WhatsApp...")});
 };
 const ch=$("#ch");ch.innerHTML=CATS.map(c=>`<button class="chip" aria-pressed="${c===cat}">${c}</button>`).join("");
 ch.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.textContent;ch.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});
 $("#q").oninput=draw;draw();
 app.querySelectorAll(".pc").forEach(b=>b.onclick=()=>{cat="All";$("#q").value=b.dataset.s;ch.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x.textContent==="All"));draw();$("#catalog").scrollIntoView({behavior:"smooth"})});
}
